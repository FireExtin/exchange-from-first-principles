[workspace]
members = [
    "crates/exchange-types",
    "crates/exchange-core",
    "crates/exchange-log",
    "crates/exchange-replay",
    "crates/exchange-bench",
    "crates/exchange-ffi",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
exchange-types = { path = "crates/exchange-types" }
exchange-core = { path = "crates/exchange-core" }
exchange-log = { path = "crates/exchange-log" }

